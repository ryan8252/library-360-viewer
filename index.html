<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="圖書館 360 度室內全景導覽"
    />
    <meta name="theme-color" content="#050706" />

    <title>線上圖書館導覽</title>
  </head>

  <body>
    <main id="viewer" aria-label="圖書館 360 度全景導覽">
      <div class="tour-status" aria-live="polite">
        <div class="tour-status__text">
          <span class="tour-status__eyebrow">目前位置</span>
          <strong id="current-scene" class="tour-status__name">拍攝點 01</strong>
        </div>
        <span id="scene-counter" class="tour-status__counter">01 / 08</span>
      </div>

      <section class="annotation-toolbar" aria-label="全景電子白板工具">
        <button
          id="annotation-mode"
          class="annotation-toolbar__mode"
          type="button"
          aria-pressed="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 16.5-.8 4.3 4.3-.8L19 8.5 15.5 5 4 16.5Zm13.1-13.1 3.5 3.5 1-1a1.5 1.5 0 0 0 0-2.1l-1.4-1.4a1.5 1.5 0 0 0-2.1 0l-1 1Z" />
          </svg>
          <span>新增文字</span>
        </button>

        <button
          id="clear-annotations"
          class="annotation-toolbar__clear"
          type="button"
          disabled
        >
          清除全部
        </button>
      </section>

      <div
        id="annotation-placement-hint"
        class="annotation-placement-hint"
        role="status"
        hidden
      >
        <span aria-hidden="true">＋</span>
        點一下要放文字的位置
        <kbd>Esc</kbd>
        取消
      </div>

      <button
        id="next-scene"
        class="navigation-hotspot"
        type="button"
        aria-label="前往拍攝點 02"
      >
        <svg
          class="navigation-hotspot__arrow"
          viewBox="0 0 100 86"
          aria-hidden="true"
        >
          <path
            class="navigation-hotspot__shape"
            d="M50 4 93 74 59 63 50 82 41 63 7 74Z"
          />
        </svg>
        <span id="next-scene-label" class="navigation-hotspot__label">
          前往拍攝點 02
        </span>
      </button>

      <dialog
        id="annotation-editor"
        class="annotation-editor"
        aria-labelledby="annotation-editor-title"
      >
        <form id="annotation-form" class="annotation-editor__form">
          <header class="annotation-editor__header">
            <span class="annotation-editor__eyebrow">電子白板</span>
            <h2 id="annotation-editor-title">新增書櫃介紹</h2>
          </header>

          <label class="annotation-editor__field" for="annotation-text">
            <textarea
              id="annotation-text"
              name="annotation-text"
              rows="3"
              maxlength="80"
              placeholder="例如：尋寶記"
              required
            ></textarea>
          </label>

          <p class="annotation-editor__shortcut">
            可按 <kbd>Ctrl</kbd>／<kbd>⌘</kbd> ＋ <kbd>Enter</kbd> 快速儲存
          </p>

          <footer class="annotation-editor__actions">
            <button
              id="annotation-delete"
              class="annotation-editor__button annotation-editor__button--danger"
              type="button"
              hidden
            >
              刪除
            </button>
            <span class="annotation-editor__action-spacer"></span>
            <button
              id="annotation-cancel"
              class="annotation-editor__button annotation-editor__button--secondary"
              type="button"
            >
              取消
            </button>
            <button
              id="annotation-save"
              class="annotation-editor__button annotation-editor__button--primary"
              type="submit"
            >
              放到全景
            </button>
          </footer>
        </form>
      </dialog>
    </main>

    <noscript>請啟用 JavaScript 以瀏覽圖書館全景導覽。</noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
